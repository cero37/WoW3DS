name: Build WotLK 3.3.5a

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-3ds:
    name: Build 3DS client
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build 3DSX
        working-directory: proto3ds
        run: |
          make

      - name: Upload 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wotlk-3ds
          path: |
            proto3ds/w3dproto.3dsx
          if-no-files-found: error

  build-converter-win:
    name: Build Windows converter
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Release build with StormLib
        run: >-
          cmake -S converter -B converter/build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DW3D_STORMLIB=ON
          -DW3D_CASC=OFF
          -DW3D_TESTS=OFF

      - name: Build converter and GUI
        run: cmake --build converter/build --config Release --target w3dconv w3dgui --parallel

      - name: Upload Windows converter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wotlk-converter-windows
          path: |
            converter/build/Release/w3dconv.exe
            converter/build/Release/w3dgui.exe
            converter/win/*.bat
          if-no-files-found: error
